<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <!-- Greeting, date, clock, theme toggle -->
    <header class="top">
      <div>
        <p id="date" class="date"></p>
        <h1>
          <span id="greeting-text"></span>
          <button id="name-btn" class="name-btn" type="button" title="Change your name"></button>
          <form id="name-form" class="inline-form" hidden>
            <label for="name-input" class="sr-only">Your name</label>
            <input id="name-input" type="text" maxlength="30" placeholder="Your name" autocomplete="given-name">
            <button class="btn btn-primary" type="submit">Save name</button>
          </form>
        </h1>
      </div>
      <div class="clock-box">
        <p id="clock" class="clock"></p>
        <button id="theme-btn" class="btn btn-ghost" type="button" aria-pressed="false"></button>
      </div>
    </header>

    <main class="layout">

      <!-- To-do list -->
      <section class="card" aria-labelledby="tasks-title">
        <div class="card-head">
          <h2 id="tasks-title">Tasks</h2>
          <span id="task-count" class="muted"></span>
        </div>
        <form id="task-form" class="row">
          <label for="task-input" class="sr-only">New task</label>
          <input id="task-input" type="text" maxlength="120" placeholder="What needs doing today?" required>
          <button class="btn btn-primary" type="submit">Add task</button>
        </form>
        <div class="row sort-row">
          <label for="sort-select" class="muted">Sort by</label>
          <select id="sort-select">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">A to Z</option>
            <option value="za">Z to A</option>
            <option value="open">Unfinished first</option>
          </select>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="task-empty" class="muted empty">No tasks yet. Add your first one above.</p>
      </section>

      <div class="side">

        <!-- Focus timer -->
        <section class="card timer-card" aria-labelledby="timer-title">
          <h2 id="timer-title">Focus timer</h2>
          <div id="ring" class="ring">
            <p id="timer-display" class="timer-display" role="timer">25:00</p>
          </div>
          <p id="timer-status" class="muted" aria-live="polite">Ready for a 25-minute session.</p>
          <div class="row center">
            <button id="timer-start" class="btn btn-primary" type="button">Start</button>
            <button id="timer-stop" class="btn btn-ghost" type="button">Stop</button>
            <button id="timer-reset" class="btn btn-ghost" type="button">Reset</button>
          </div>
        </section>

        <!-- Quick links -->
        <section class="card" aria-labelledby="links-title">
          <h2 id="links-title">Quick links</h2>
          <ul id="link-list" class="link-list"></ul>
          <form id="link-form" class="link-form">
            <label for="link-name" class="sr-only">Link name</label>
            <input id="link-name" type="text" maxlength="20" placeholder="Name" required>
            <label for="link-url" class="sr-only">Link address</label>
            <input id="link-url" type="text" placeholder="example.com" required>
            <button class="btn btn-primary" type="submit">Add link</button>
          </form>
          <p id="link-error" class="error" role="alert" hidden></p>
        </section>

      </div>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
